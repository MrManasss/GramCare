services:
  # ⚙️ Backend (FastAPI)
  - type: web
    name: gramcare-backend
    env: python
    region: ohio
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set manually in Render Dashboard
      - key: PYTHON_VERSION
        value: 3.11.8

  # 🌐 Frontend (Vite/React)
  - type: static
    name: gramcare-frontend
    region: ohio
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: gramcare-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html

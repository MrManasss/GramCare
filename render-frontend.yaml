services:
  # 🌐 Frontend (Vite/React)
  - type: static
    name: gramcare-frontend
    region: ohio
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: gramcare-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
